prepare:
  image_size: 224
  max_per_class: 300
  seed: 42
  train_fraction: 0.8
  validation_fraction: 0.1
train:
  model_type: mobilenet_v3_small_transfer
  backbone: mobilenet_v3_small_imagenet
  batch_size: 32
  classifier_candidates:
    logistic_regression: [0.1, 1.0, 10.0]
    linear_svc: [0.1]
    rbf_svc: [1.0, 3.0]
  seed: 42
